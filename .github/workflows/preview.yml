name: Preview screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iostrackercar/TrackerCar/**'
      - 'iostrackercar/Shared/**'
      - 'iostrackercar/Widgets/**'
      - 'iostrackercar/project.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview-pages
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: iostrackercar
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          xcodebuild -project TrackerCar.xcodeproj -scheme TrackerCar \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
      - name: Screenshots
        run: |
          D=$(xcrun simctl list devices available | grep -E "iPhone .* Pro \(" | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$D" ]; then D=$(xcrun simctl list devices available | grep iPhone | head -1 | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}'); fi
          echo "Device: $D"
          xcrun simctl boot $D
          xcrun simctl bootstatus $D -b
          xcrun simctl install $D build/Build/Products/Debug-iphonesimulator/TrackerCar.app
          xcrun simctl privacy $D grant location com.example.trackercar
          mkdir shots
          shot() { xcrun simctl terminate $D com.example.trackercar || true; xcrun simctl launch $D com.example.trackercar "${@:2}"; sleep 5; xcrun simctl io $D screenshot "shots/$1.png"; }
          shot 1-start -demo -tab 0
          shot 2-przejazdy -tab 1
          shot 3-przejazdy-rozwiniete -tab 1 -expand YES
          shot 4-mapa-przejazdu -tab 1 -expand YES -openfirst YES
          shot 5-statystyki -tab 2
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: iostrackercar/shots

  # Publikuje najnowsze zrzuty jako stronę (GitHub Pages) – otwierasz link zamiast pobierać ZIP.
  deploy:
    needs: preview
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: site
      - name: Build gallery page
        run: |
          cd site
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackerCar preview</title>'
            echo '<body style="background:#1b1b1b;color:#f3f3f3;font-family:sans-serif;margin:0;padding:16px">'
            echo "<h2 style='letter-spacing:3px'>TRACKERCAR · PODGLĄD</h2><p style='opacity:.6'>Commit ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')</p>"
            echo "<div style='display:flex;flex-wrap:wrap;gap:16px'>"
            for f in *.png; do
              echo "<figure style='margin:0;width:260px'><img src='$f' alt='$f' style='width:100%;border-radius:14px'><figcaption style='opacity:.6;padding-top:6px'>$f</figcaption></figure>"
            done
            echo '</div></body>'
          } > index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
