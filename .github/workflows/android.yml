name: Build APK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    defaults:
      run:
        working-directory: iostrackercar/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Name the APK with its version
        run: cp app/build/outputs/apk/debug/app-debug.apk "TrackerCar-v${{ github.run_number }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TrackerCar-apk-v${{ github.run_number }}
          path: iostrackercar/android/TrackerCar-v${{ github.run_number }}.apk
