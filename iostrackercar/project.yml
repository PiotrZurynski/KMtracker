name: TrackerCar
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TrackerCar:
    type: application
    platform: iOS
    sources: [TrackerCar, Shared]
    dependencies:
      - target: TrackerCarWidgets
    info:
      path: TrackerCar/Info.plist
      properties:
        CFBundleDisplayName: TrackerCar
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        NSSupportsLiveActivities: true
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Aplikacja liczy przejechane kilometry tylko między Start a Stop. Lokalizacja nie opuszcza telefonu."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trackercar
  TrackerCarWidgets:
    type: app-extension
    platform: iOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: TrackerCar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.trackercar.widgets
